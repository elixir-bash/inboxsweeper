name = "inboxsweeper-backend"
main = "index.js"
compatibility_date = "2024-11-01"

# Anonymous counters. Create with:  wrangler kv namespace create STATS
# then paste the returned id below.
kv_namespaces = [
  { binding = "STATS", id = "PASTE_KV_NAMESPACE_ID_HERE" }
]

[vars]
GH_REPO = "elixir-bash/inboxsweeper"

# Secret (do NOT put in this file):
#   wrangler secret put GH_TOKEN     # a GitHub PAT with public_repo (issues) scope
