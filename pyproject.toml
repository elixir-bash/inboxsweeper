[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "inboxsweeper"
description = "Clean years of junk out of your inbox and actually unsubscribe — free, open source, and 100% on your own machine."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Mukundan Govindaraj" }]
keywords = [
    "email", "gmail", "imap", "inbox", "unsubscribe", "cleanup",
    "privacy", "spam", "declutter", "yahoo",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Communications :: Email",
    "Topic :: Utilities",
]
dependencies = ["requests>=2.28"]
dynamic = ["version"]

[project.urls]
Homepage = "https://elixir-bash.github.io/inboxsweeper/"
Source = "https://github.com/elixir-bash/inboxsweeper"
Issues = "https://github.com/elixir-bash/inboxsweeper/issues"
Changelog = "https://github.com/elixir-bash/inboxsweeper/releases"

[project.scripts]
inboxsweeper = "inboxsweeper:main"

[tool.setuptools]
# Flat modules, not a package: webui imports inboxsweeper directly, and
# app.py is the PyInstaller entry point only — it has no place in the wheel.
py-modules = ["inboxsweeper", "webui"]

[tool.setuptools.dynamic]
# Single source of truth. TOOL_VERSION is also what telemetry reports, so the
# published version and the reported version can't drift.
version = { attr = "inboxsweeper.TOOL_VERSION" }
