name: Label site feedback

# The Worker files feedback issues as inboxsweeper-bot, which is not a
# collaborator on purpose (its PAT lives in a Cloudflare secret, and push
# access on this repo would be write access to shipped installers).
# Non-collaborators can't set labels at creation time, so we apply them here.

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  label:
    if: github.event.issue.user.login == 'inboxsweeper-bot'
    runs-on: ubuntu-latest
    steps:
      - run: gh issue edit "$NUMBER" --repo "$REPO" --add-label feedback --add-label from-site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
