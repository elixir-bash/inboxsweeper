name: Build installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Least privilege at the top; the build job widens only what it needs.
permissions: {}

jobs:
  build:
    # Only the Windows one-file .exe is shipped as a prebuilt binary now.
    # Mac/Linux use the double-click launcher (InboxSweeper.command) over the
    # source ZIP, so there's nothing to build for them.
    runs-on: windows-latest
    permissions:
      contents: write      # create the release + upload the .exe
      id-token: write      # OIDC identity for build provenance
      attestations: write  # record the provenance attestation
    steps:
      # Actions are pinned to commit SHAs: a tag like @v4 is mutable, so an
      # upstream compromise would silently reach the binary users download.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.11'
      - run: pip install pyinstaller requests

      - name: Build (Windows)
        run: >
          pyinstaller --noconfirm --onefile --name InboxSweeper
          --collect-submodules requests --hidden-import webui --hidden-import inboxsweeper app.py

      # We don't pay for an Authenticode cert, so the .exe is unsigned and
      # SmartScreen warns. Provenance is the free alternative: it proves this
      # binary was built by this workflow from this commit. Verify with
      #   gh attestation verify InboxSweeper.exe --repo elixir-bash/inboxsweeper
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: dist/InboxSweeper.exe

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          files: |
            dist/InboxSweeper.exe
