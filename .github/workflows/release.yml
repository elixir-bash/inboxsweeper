name: Build installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyinstaller requests

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --windowed --name InboxSweeper \
            --collect-submodules requests --hidden-import webui --hidden-import inboxsweeper app.py
          cd dist && zip -r InboxSweeper-macos.zip InboxSweeper.app

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: >
          pyinstaller --noconfirm --onefile --name InboxSweeper
          --collect-submodules requests --hidden-import webui --hidden-import inboxsweeper app.py

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/InboxSweeper-macos.zip
            dist/InboxSweeper.exe
